[project]
name = "skilltest"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4,<5"]

[project.scripts]
skilltest = "skilltest.cli:main"

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["process_smoke: real local subprocess integration; no installed provider or network"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skilltest"]

[tool.hatch.build.targets.wheel.force-include]
"result.schema.json" = "skilltest/_result.schema.json"
