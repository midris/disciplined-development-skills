[project]
name = "skilltest"
version = "0.1.0"
requires-python = ">=3.11"

[project.scripts]
skilltest = "skilltest.cli:main"

[dependency-groups]
dev = [
    "jsonschema",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["process_smoke: real local subprocess integration; no installed provider or network"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skilltest"]
